name: MVP checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pytest -q
      - run: python -m compileall -q backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check web/study.js
      - run: node --check web/exam.js
      - run: node --check web/account.js
      - run: node --check web/plans.js
      - run: node --check web/dashboard.js
      - run: node --check web/essays.js
      - run: node --test tests/essay-fixture.test.cjs
