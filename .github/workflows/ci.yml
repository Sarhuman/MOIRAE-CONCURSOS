name: MVP checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pytest -q
      - run: python -m compileall -q backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node -e "const fs=require('node:fs'),cp=require('node:child_process');for(const f of fs.readdirSync('web').filter(f=>f.endsWith('.js')))cp.execFileSync(process.execPath,['--check','web/'+f],{stdio:'inherit'});"
      - run: node --test tests/*.test.cjs
